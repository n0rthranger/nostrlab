name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://nostrlab:nostrlab@localhost:5432/nostrlab?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NOSTR_RELAYS: wss://relay.damus.io
      NEXT_PUBLIC_NOSTR_RELAYS: wss://relay.damus.io
      NOSTRLAB_SESSION_SECRET: CI_SESSION_PLACEHOLDER_DO_NOT_USE_1234567890
      LIGHTNING_MODE: mock
      UPLOAD_BACKEND: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build
        run: pnpm build
